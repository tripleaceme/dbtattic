<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <!--
    Activity bar icon: the same attic-on-the-data-layers mark as media/logo.svg,
    reduced to what survives 24px. The attic window is deliberately dropped:
    at this size it renders as a blob rather than a window, and the roof plus
    layered stack already carries the silhouette. Single colour via
    currentColor so VS Code themes it for light and dark.
  -->
  <path d="M12 3 L21.5 10 H2.5 Z"/>
  <rect x="5" y="13" width="14" height="3.7" rx="1.85"/>
  <rect x="5" y="18.3" width="14" height="3.7" rx="1.85"/>
</svg>
